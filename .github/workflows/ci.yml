name: CI Pipeline - OrangeHRM Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Report
    runs-on: ubuntu-latest

    steps:

      # 1. Obtener el código fuente
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Java 11
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 3. Construir el proyecto
      - name: Build project
        run: mvn compile test-compile -B

      # 4. Pruebas de UI (Chrome corre en headless gracias a la variable CI=true)
      - name: Run UI Tests
        run: mvn test -Dtest="LoginTest,AddEmployeeTest,DirectoryTest" -B
        continue-on-error: true

      # 5. Pruebas de API
      - name: Run API Tests
        run: mvn test -Dtest="AuthApiTest,EmployeeApiTest" -B
        continue-on-error: true

      # 6. Pruebas de Performance
      - name: Run Performance Tests (Gatling)
        run: mvn gatling:test -B
        continue-on-error: true

      # 7. Guardar reporte de ExtentReports (UI + API)
      - name: Upload ExtentReports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-reports
          path: reports/
          retention-days: 30

      # 8. Guardar reportes de Gatling (Performance)
      - name: Upload Gatling Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatling-reports
          path: target/gatling/
          retention-days: 30

      # 9. Resumen en la interfaz de GitHub
      - name: Test Summary
        if: always()
        run: |
          echo "## Resultados del Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite            | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|------------------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pruebas UI       | Ver artefacto \`extent-reports\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pruebas API      | Ver artefacto \`extent-reports\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance      | Ver artefacto \`gatling-reports\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Los reportes HTML están disponibles en la sección **Artifacts** de esta ejecución." >> $GITHUB_STEP_SUMMARY
